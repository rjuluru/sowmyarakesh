<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sowmya & Rakesh — Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #d4af37;
      --gold-light: #f0e68c;
      --burgundy: #5a1f3a;
      --burgundy-light: #8b3a4a;
      --cream: #faf8f3;
      --cream-dark: #f0ebe3;
      --text-dark: #1a1a1a;
      --text-soft: #4a4a4a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cormorant Garamond', serif;
      background: var(--cream);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      background: rgba(250, 248, 243, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212,175,55,0.3);
    }

    nav a {
      text-decoration: none;
      color: var(--text-soft);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1.5px;
      background: var(--gold);
      transition: width 0.3s;
    }

    nav a:hover { color: var(--gold); }
    nav a:hover::after { width: 100%; }

    @media (max-width: 600px) {
      nav { flex-wrap: wrap; gap: 0.6rem 1rem; padding: 0.7rem 1rem; justify-content: center; }
      nav a { font-size: 0.75rem; letter-spacing: 1px; }
    }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      padding: 6rem 2rem 4rem;
      background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 50%, var(--cream) 100%);
      box-shadow: inset 0 0 120px rgba(212, 175, 55, 0.08);
    }

    .hero-ornament {
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.5rem auto;
    }

    .hero-pre {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeInDown 1s 0.3s forwards;
    }

    .hero-names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 8vw, 6.5rem);
      color: var(--burgundy);
      line-height: 1.2;
      opacity: 0;
      animation: fadeInUp 1.2s 0.6s forwards;
    }

    .hero-names .ampersand {
      display: inline-block;
      color: var(--gold);
      font-size: 0.7em;
      margin: 0 0.3em;
    }

    .hero-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--text-soft);
      margin-top: 0.5rem;
      opacity: 0;
      animation: fadeInUp 1s 1s forwards;
    }

    .hero-hosted {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--text-soft);
      margin-top: 1.5rem;
      opacity: 0;
      animation: fadeInUp 1s 1.1s forwards;
      line-height: 1.8;
    }

    .hero-hosted strong {
      color: var(--burgundy);
      font-weight: 600;
    }

    .hero-image-wrapper {
      margin-top: 2.5rem;
      position: relative;
      opacity: 0;
      animation: fadeInUp 1.2s 1.3s forwards;
    }

    .hero-image-frame {
      position: relative;
      display: inline-block;
      padding: 8px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(90, 31, 58, 0.2), 0 15px 40px rgba(212, 175, 55, 0.15);
    }

    .hero-image-frame img {
      display: block;
      width: min(360px, 80vw);
      height: auto;
      max-height: 420px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .scroll-hint {
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeInUp 1s 1.8s forwards;
    }

    .scroll-hint a {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: var(--gold);
      transition: all 0.3s ease;
      cursor: pointer;
      opacity: 0.7;
    }

    .scroll-hint a:hover {
      opacity: 1;
    }

    .scroll-hint a:hover .scroll-arrow {
      border-color: var(--burgundy);
    }

    .scroll-hint a span {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .scroll-arrow {
      display: inline-block;
      width: 14px; height: 14px;
      border-right: 2px solid var(--gold);
      border-bottom: 2px solid var(--gold);
      transform: rotate(45deg);
      animation: bounceDown 1.5s ease-in-out infinite;
      transition: border-color 0.4s;
    }

    @keyframes bounceDown {
      0%, 100% { transform: rotate(45deg) translateY(0); }
      50% { transform: rotate(45deg) translateY(6px); }
    }

    /* Section Styles */
    section {
      position: relative;
      z-index: 1;
      padding: 6rem 2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--burgundy);
      font-weight: 700;
    }

    .section-title .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.8rem;
    }

    .section-title .ornament span {
      color: var(--gold);
      font-size: 1.2rem;
    }

    .section-title .ornament::before,
    .section-title .ornament::after {
      content: '';
      width: 60px; height: 1px;
      background: var(--gold);
    }

    /* Events Section */
    .events {
      padding: 8rem 2rem !important;
    }

    .events-container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .event-card {
      background: linear-gradient(135deg, #fff 0%, var(--cream) 100%);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 40px rgba(90,31,58,0.12), 0 0 0 1px rgba(212,175,55,0.15);
      border-top: 4px solid var(--gold);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(90,31,58,0.2), 0 0 0 1px rgba(212,175,55,0.25);
    }

    .event-card .event-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .event-card .event-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--burgundy);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .event-card .event-datetime {
      background: linear-gradient(135deg, var(--burgundy), var(--burgundy-light));
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      width: 100%;
    }

    .event-card .event-date {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .event-card .event-time {
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
      color: var(--gold-light);
      margin-top: 0.2rem;
    }

    .event-card .event-auspicious {
      font-size: 0.95rem;
      color: var(--gold);
      font-style: italic;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      background: rgba(212,175,55,0.08);
      border-radius: 8px;
      display: inline-block;
    }

    .event-card .event-description {
      font-size: 1.05rem;
      color: var(--text-soft);
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .event-card .event-bottom {
      margin-top: auto;
      width: 100%;
      padding-top: 1rem;
      border-top: 1px solid rgba(212,175,55,0.15);
    }

    .event-card .event-venue {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--text-dark);
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .event-card .event-address {
      font-size: 0.95rem;
      color: var(--text-soft);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .event-card .event-map-link {
      display: inline-block;
      color: #fff;
      background: var(--gold);
      text-decoration: none;
      font-weight: 600;
      padding: 0.6rem 1.5rem;
      border-radius: 25px;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .event-card .event-map-link:hover {
      background: var(--burgundy);
      transform: scale(1.05);
    }

    .countdown {
      text-align: center;
      padding: 3.5rem 2rem;
      background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(90,31,58,0.06));
      border-radius: 25px;
      margin-top: 3rem;
      border: 2px solid rgba(212,175,55,0.25);
      grid-column: 1 / -1;
    }

    .countdown-label {
      font-size: 1rem;
      color: var(--burgundy);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 2rem;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }

    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .countdown-item {
      text-align: center;
      padding: 1.2rem 1.5rem;
      background: rgba(255,255,255,0.6);
      border-radius: 15px;
      min-width: 90px;
      border: 1px solid rgba(212,175,55,0.2);
    }

    .countdown-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--burgundy);
      font-weight: 700;
      line-height: 1;
    }

    .countdown-unit {
      font-size: 0.85rem;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0.6rem;
      font-weight: 600;
    }

    /* Section alternating backgrounds */
    .section-bg-a {
      background: linear-gradient(180deg, var(--cream-dark) 0%, #fff 50%, var(--cream-dark) 100%);
    }

    .section-bg-b {
      background: linear-gradient(180deg, var(--cream) 0%, var(--cream-dark) 50%, var(--cream) 100%);
    }

    /* Streaming Section */
    .streaming-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .stream-card {
      background: linear-gradient(135deg, #fff 0%, var(--cream) 100%);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 30px rgba(90,31,58,0.1);
      border: 1px solid rgba(212,175,55,0.15);
    }

    .stream-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--burgundy);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .youtube-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(90,31,58,0.15);
    }

    .youtube-embed iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      border-radius: 12px;
    }

    .stream-coming-soon {
      text-align: center;
      padding: 3rem 2rem;
      background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(90,31,58,0.04));
      border-radius: 15px;
      border: 2px dashed rgba(212,175,55,0.3);
    }

    .stream-coming-soon .coming-soon-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .stream-coming-soon p {
      font-size: 1.15rem;
      color: var(--text-soft);
      line-height: 1.8;
    }

    .stream-coming-soon .coming-soon-label {
      display: inline-block;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    /* Slideshow Section */
    .slideshow-section {
      padding: 6rem 2rem;
    }

    .slideshow-wrapper {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(90,31,58,0.15);
      min-height: 500px;
      background: var(--cream-dark);
    }

    .slideshow-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      background: var(--cream-dark);
    }

    .slideshow-wrapper img.active {
      opacity: 1;
    }

    .slideshow-controls {
      text-align: center;
      margin-top: 1.5rem;
    }

    .slideshow-controls button {
      background: none;
      border: 2px solid var(--gold);
      color: var(--gold);
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      margin: 0 0.5rem;
      transition: all 0.3s;
    }

    .slideshow-controls button:hover {
      background: var(--gold);
      color: #fff;
    }

    .slideshow-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-soft);
      font-size: 1.1rem;
    }

    /* Gallery Section */
    .gallery-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
    }

    .gallery-tab {
      padding: 0.7rem 1.8rem;
      border: 2px solid var(--gold);
      border-radius: 30px;
      background: transparent;
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .gallery-tab:hover,
    .gallery-tab.active {
      background: var(--gold);
      color: #fff;
    }

    .gallery-grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .gallery-grid img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .gallery-grid img:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(90,31,58,0.2);
    }

    .gallery-empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-soft);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    .gallery-show-more {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 1rem;
    }

    .gallery-show-more button {
      padding: 0.8rem 2.5rem;
      border: 2px solid var(--gold);
      border-radius: 30px;
      background: transparent;
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .gallery-show-more button:hover {
      background: var(--gold);
      color: #fff;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .lightbox-close {
      position: absolute;
      top: 20px; right: 30px;
      color: #fff;
      font-size: 2.5rem;
      cursor: pointer;
      z-index: 1001;
      background: none;
      border: none;
      line-height: 1;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      z-index: 1001;
      line-height: 1;
    }

    .lightbox-nav:hover {
      background: rgba(255,255,255,0.3);
      border-color: rgba(255,255,255,0.7);
    }

    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }

    @media (max-width: 600px) {
      .lightbox-nav { width: 40px; height: 40px; font-size: 1.5rem; }
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
    }

    /* Footer */
    footer {
      background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-light) 100%);
      text-align: center;
      padding: 4rem 2rem;
      position: relative;
      z-index: 1;
    }

    footer .footer-ornament {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
      margin: 0 auto 1.5rem;
    }

    footer p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: rgba(255,255,255,0.8);
      line-height: 1.8;
    }

    footer .footer-names {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: var(--gold-light);
      margin-top: 1rem;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Videos Section */
    .videos-container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 2rem;
    }

    .video-card {
      background: linear-gradient(135deg, #fff 0%, var(--cream) 100%);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(90,31,58,0.1);
      border: 1px solid rgba(212,175,55,0.15);
    }

    .video-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--burgundy);
      margin-bottom: 1.2rem;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .countdown-timer { gap: 0.8rem; }
      .countdown-number { font-size: 1.8rem; }
      .countdown-item { min-width: 70px; padding: 1rem; }
      .event-card { padding: 1.5rem; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .gallery-grid img { height: 150px; }
      .slideshow-section { padding: 2rem 0 !important; }
      .slideshow-wrapper { min-height: 80vh; border-radius: 0; box-shadow: none; }
      .slideshow-wrapper img { object-fit: contain; }
      .videos-container { grid-template-columns: 1fr; }
      .hero-image-frame { padding: 6px; border-radius: 14px; }
      .hero-image-frame img { width: min(280px, 75vw); max-height: 340px; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->

    /* ── Render orchestrator ── */
    function renderContent() {
      if (!config) return;
      renderHero();

      renderStreaming();
      renderVideos();
      renderSlideshow();
      renderGallery();
      renderFooter();
      setupLightbox();
      applyAlternatingBackgrounds();
    }

    function applyAlternatingBackgrounds() {
      const sectionIds = ['slideshow', 'events', 'streaming', 'gallery', 'videos'];
      let bgIndex = 0;
      sectionIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('section-bg-a', 'section-bg-b');
        if (el.style.display !== 'none') {
          el.classList.add(bgIndex % 2 === 0 ? 'section-bg-a' : 'section-bg-b');
          bgIndex++;
        }
      });
    }

    /* ── Hero ── */
    function renderHero() {
      const c = config.couple;
      document.getElementById('heroPre').textContent = c.heroLabel || 'Wedding Invitation';
      document.getElementById('heroName1').textContent = c.name1;
      document.getElementById('heroName2').textContent = c.name2;
      document.getElementById('heroTagline').textContent = c.tagline ? `"${c.tagline}"` : '';
      document.getElementById('heroImage').src = c.heroImage;
      document.getElementById('heroImage').alt = `${c.name1} & ${c.name2}`;

      const hostedEl = document.getElementById('heroHosted');
      if (config.hostedBy && config.hostedBy.enabled && config.hostedBy.names.length) {
        hostedEl.innerHTML = `${config.hostedBy.label}<br><strong>${config.hostedBy.names.join(' & ')}</strong>`;
      } else {
        hostedEl.style.display = 'none';
      }
    }

    /* ── Events ── */
    function renderEvents() {
      const enabledEvents = Object.entries(config.events)
        .filter(([, ev]) => ev.enabled)
        .map(([key, ev]) => ({ ...ev, key }));

      if (enabledEvents.length === 0) {
        document.getElementById('events').style.display = 'none';
        document.getElementById('eventsNavLink').style.display = 'none';
        return;
      }

      document.getElementById('events').style.display = 'block';
      document.getElementById('eventsNavLink').style.display = 'inline-block';

      const container = document.getElementById('eventsContainer');
      container.innerHTML = '';

      enabledEvents.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'event-card';
        let html = '';

        if (ev.icon) html += `<div class="event-icon">${ev.icon}</div>`;
        html += `<div class="event-title">${ev.title}</div>`;
        html += `<div class="event-datetime">`;
        html += `<div class="event-date">${formatDate(ev.date)}</div>`;
        if (ev.time) html += `<div class="event-time">${ev.time}</div>`;
        html += `</div>`;
        if (ev.auspiciousDetails) html += `<div class="event-auspicious">${ev.auspiciousDetails}</div>`;
        if (ev.description) html += `<div class="event-description">${ev.description}</div>`;
        html += `<div class="event-bottom">`;
        if (ev.venue) html += `<div class="event-venue">${ev.venue}</div>`;
        if (ev.address) html += `<div class="event-address">${ev.address}</div>`;
        if (ev.googleMapsUrl) html += `<a href="${ev.googleMapsUrl}" target="_blank" class="event-map-link">📍 View on Maps</a>`;
        if (!ev.venue && !ev.address && !ev.googleMapsUrl) html += `<div class="event-venue" style="visibility:hidden;">&nbsp;</div>`;
        html += `</div>`;

        card.innerHTML = html;
        container.appendChild(card);
      });

      const wedding = config.events.wedding;
      if (wedding && wedding.enabled && wedding.date) {
        const cd = document.createElement('div');
        cd.className = 'countdown';
        cd.innerHTML = `
          <div class="countdown-label">Countdown to the Sumuhurtham</div>

    /* ── Streaming ── */
    function renderStreaming() {
      const s = config.streaming;
      if (!s || !s.enabled || !s.streams || s.streams.length === 0) {
        document.getElementById('streaming').style.display = 'none';
        document.getElementById('streamingNavLink').style.display = 'none';
        return;
      }

      const hasContent = s.streams.some(st => st.comingSoon || st.youtubeLink);
      if (!hasContent) {
        document.getElementById('streaming').style.display = 'none';
        document.getElementById('streamingNavLink').style.display = 'none';
        return;
      }

      document.getElementById('streaming').style.display = 'block';
      document.getElementById('streamingNavLink').style.display = 'inline-block';
      if (s.title) document.getElementById('streamingTitle').textContent = s.title;

      const container = document.getElementById('streamingContainer');
      container.innerHTML = '';

      s.streams.forEach(stream => {
        const card = document.createElement('div');
        card.className = 'stream-card';
        let html = `<h3>${stream.title}</h3>`;

        if (stream.youtubeLink) {
          const ytId = extractYoutubeId(stream.youtubeLink);
          if (ytId) {
            html += `<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`;
          }
        } else if (stream.comingSoon) {
          html += `
            <div class="stream-coming-soon">
              <div class="coming-soon-icon">📡</div>
              <div class="coming-soon-label">Coming Soon</div>
              <p>${stream.comingSoonMessage || 'The live stream link will be available soon. Please check back later!'}</p>
            </div>`;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    /* ── Videos ── */

      const v = config.videos;
      if (!v || !v.enabled || !v.items || v.items.length === 0) {
        document.getElementById('videos').style.display = 'none';
        document.getElementById('videosNavLink').style.display = 'none';

      document.getElementById('videos').style.display = 'block';
      document.getElementById('videosNavLink').style.display = 'inline-block';

      const container = document.getElementById('videosContainer');
      container.innerHTML = '';

      v.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-card';
        let html = `<h3>${item.title}</h3>`;

        if (item.youtubeLink) {

          if (ytId) {
            html += `<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`;

          html += `
            <div class="stream-coming-soon">
              <div class="coming-soon-icon">🎬</div>

    /* ── Slideshow ── */
    let slideshowIndex = 0;
    let slideshowInterval = null;

    function renderSlideshow() {
      const s = config.slideshow;
      if (!s || !s.enabled || !s.images || s.images.length === 0) {
        document.getElementById('slideshow').style.display = 'none';
        document.getElementById('slideshowNavLink').style.display = 'none';
        return;
      }

      document.getElementById('slideshow').style.display = 'block';
      document.getElementById('slideshowNavLink').style.display = 'inline-block';

      const wrapper = document.getElementById('slideshowWrapper');
      wrapper.innerHTML = '';

      const shuffled = [...s.images].sort(() => Math.random() - 0.5);

      shuffled.forEach((src, i) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Moment';
        if (i === 0) img.classList.add('active');
        wrapper.appendChild(img);
      });

      if (shuffled.length > 1) {
        document.getElementById('slideshowControls').style.display = 'block';
        document.getElementById('slideshowPrev').onclick = () => slideshowNav(-1);
        document.getElementById('slideshowNext').onclick = () => slideshowNav(1);

        slideshowInterval = setInterval(() => slideshowNav(1), s.interval || 5000);
      }
    }

    function slideshowNav(dir) {
      const imgs = document.querySelectorAll('#slideshowWrapper img');
      if (imgs.length === 0) return;
      imgs[slideshowIndex].classList.remove('active');
      slideshowIndex = (slideshowIndex + dir + imgs.length) % imgs.length;
      imgs[slideshowIndex].classList.add('active');

      if (slideshowInterval) clearInterval(slideshowInterval);
      slideshowInterval = setInterval(() => slideshowNav(1), config.slideshow.interval || 5000);
    }

    /* ── Gallery ── */
    let currentGalleryImages = [];
    let galleryVisibleCount = 20;
    let currentLightboxIndex = -1;

    function renderGallery() {
      const g = config.gallery;
      if (!g || !g.enabled) {
        document.getElementById('gallery').style.display = 'none';
        document.getElementById('galleryNavLink').style.display = 'none';
        return;
      }

      const eventsWithImages = g.events.filter(e => e.images && e.images.length > 0);
      if (eventsWithImages.length === 0) {
        document.getElementById('gallery').style.display = 'none';
        document.getElementById('galleryNavLink').style.display = 'none';
        return;
      }

      document.getElementById('gallery').style.display = 'block';
      document.getElementById('galleryNavLink').style.display = 'inline-block';

      const tabs = document.getElementById('galleryTabs');
      const grid = document.getElementById('galleryGrid');
      tabs.innerHTML = '';

      if (eventsWithImages.length > 1) {
        const allTab = document.createElement('button');
        allTab.className = 'gallery-tab active';
        allTab.textContent = 'All';
        allTab.onclick = () => showGallery(null, allTab);
        tabs.appendChild(allTab);
      }

      eventsWithImages.forEach((ev, i) => {
        const tab = document.createElement('button');
        tab.className = 'gallery-tab' + (eventsWithImages.length === 1 && i === 0 ? ' active' : '');
        tab.textContent = ev.name;
        tab.onclick = () => showGallery(ev, tab);
        tabs.appendChild(tab);
      });

      showGallery(eventsWithImages.length === 1 ? eventsWithImages[0] : null,
                   tabs.querySelector('.active'));
    }

    function showGallery(eventFilter, activeTab) {
      const g = config.gallery;
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active'));
      if (activeTab) activeTab.classList.add('active');

      let images = [];
      if (eventFilter) {
        images = eventFilter.images.map(img => `${eventFilter.folder}/${img}`);
      } else {
        g.events.forEach(ev => {
          if (ev.images) {
            ev.images.forEach(img => images.push(`${ev.folder}/${img}`));
          }
        });
      }

      currentGalleryImages = images;
      galleryVisibleCount = 20;

      if (images.length === 0) {
        grid.innerHTML = '<div class="gallery-empty">Photos coming soon</div>';
        return;
      }

      renderGalleryImages();
    }

    function renderGalleryImages() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';
      const images = currentGalleryImages;
      const visible = Math.min(galleryVisibleCount, images.length);

      for (let idx = 0; idx < visible; idx++) {
        const img = document.createElement('img');
        img.src = images[idx];
        img.alt = 'Gallery photo';
        img.loading = 'lazy';
        img.onclick = ((i) => () => openLightbox(i))(idx);
        grid.appendChild(img);
      }

      if (visible < images.length) {
        const moreDiv = document.createElement('div');
        moreDiv.className = 'gallery-show-more';
        const remaining = images.length - visible;
        const btn = document.createElement('button');
        btn.textContent = `Show More (${remaining} remaining)`;
        btn.onclick = () => {
          galleryVisibleCount += 10;
          renderGalleryImages();
        };
        moreDiv.appendChild(btn);
        grid.appendChild(moreDiv);
      }
    }

    /* ── Lightbox ── */
    function setupLightbox() {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightboxClose').onclick = () => closeLightbox();
      lb.onclick = (e) => { if (e.target === lb) closeLightbox(); };
      document.getElementById('lightboxPrev').onclick = (e) => { e.stopPropagation(); navigateLightbox(-1); };
      document.getElementById('lightboxNext').onclick = (e) => { e.stopPropagation(); navigateLightbox(1); };
      document.addEventListener('keydown', (e) => {
        if (!lb.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigateLightbox(-1);
        if (e.key === 'ArrowRight') navigateLightbox(1);
      });
    }

    function openLightbox(index) {
      const lb = document.getElementById('lightbox');
      currentLightboxIndex = index;
      document.getElementById('lightboxImg').src = currentGalleryImages[index];
      document.getElementById('lightboxPrev').style.display = currentGalleryImages.length > 1 ? 'flex' : 'none';
      document.getElementById('lightboxNext').style.display = currentGalleryImages.length > 1 ? 'flex' : 'none';
      lb.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      currentLightboxIndex = -1;
    }

    function navigateLightbox(dir) {
      if (currentGalleryImages.length === 0 || currentLightboxIndex < 0) return;
      currentLightboxIndex = (currentLightboxIndex + dir + currentGalleryImages.length) % currentGalleryImages.length;
      document.getElementById('lightboxImg').src = currentGalleryImages[currentLightboxIndex];
    }

    /* ── Footer ── */
    function renderFooter() {
      document.getElementById('footerTagline').textContent = config.footer.tagline || '';
      document.getElementById('footerNames').textContent = `${config.couple.name1} & ${config.couple.name2}`;
    }

    /* ── Utilities ── */
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function extractYoutubeId(url) {
      if (!url) return null;
      const re = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const m = url.match(re);
      return (m && m[2].length === 11) ? m[2] : null;
    }

    function startCountdown(dateStr, timeStr) {
      function parseTarget(dateStr, timeStr) {
        const parts = dateStr.split('-');
        let year = parseInt(parts[0], 10);
        let month = parseInt(parts[1], 10) - 1;
        let day = parseInt(parts[2], 10);
        let hours = 0, minutes = 0;
        if (timeStr) {
          const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
          if (match) {
            hours = parseInt(match[1], 10);
            minutes = parseInt(match[2], 10);
            const ampm = match[3].toUpperCase();
            if (ampm === 'PM' && hours !== 12) hours += 12;
            if (ampm === 'AM' && hours === 12) hours = 0;
          }
        }
        return new Date(year, month, day, hours, minutes, 0).getTime();
      }
      const target = parseTarget(dateStr, timeStr);
      function update() {
        const now = Date.now();
        const dist = target - now;
        if (isNaN(dist)) return;

        if (dist < 0) {
          const timer = document.getElementById('countdownTimer');
          if (timer) {
            timer.parentElement.innerHTML = `
              <div style="font-size:2rem; margin-bottom:0.8rem;">🎊</div>
              <div class="countdown-label" style="margin-bottom:0.5rem;">The Auspicious Moment Has Arrived!</div>
              <p style="font-size:1.15rem; color:var(--text-soft); line-height:1.8;">We are now married! Thank you for your blessings and love.</p>
            `;
          }
          return;
        }

        const d = Math.floor(dist / 86400000);
        const h = Math.floor((dist % 86400000) / 3600000);
        const m = Math.floor((dist % 3600000) / 60000);
        const s = Math.floor((dist % 60000) / 1000);

        const de = document.getElementById('cd-days');
        const he = document.getElementById('cd-hours');
        const me = document.getElementById('cd-mins');
        const se = document.getElementById('cd-secs');
        if (de) de.textContent = d;
        if (he) he.textContent = h;
        if (me) me.textContent = m;
        if (se) se.textContent = s;
      }
      update();
      setInterval(update, 1000);
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', () => {
      renderContent();
    });
  </script>
</body>
</html>
